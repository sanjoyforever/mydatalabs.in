version: '3.8'

services:
  web:
    image: mydatalabs
    build:
      context: .
      dockerfile: Dockerfile

    container_name: mydatalabs

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      FLASK_ENV: production

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s